services:
  proxy:
    ports: !override
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the public IP or hostname}
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST
    volumes: !override
      - ./docker/nginx-public.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_STATE_DIR:-/opt/bhp/tls}/letsencrypt:/etc/letsencrypt:ro
      - ${TLS_STATE_DIR:-/opt/bhp/tls}/webroot:/var/www/certbot:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8081/api/health]
  certbot:
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles: [certificates]
    volumes:
      - ${TLS_STATE_DIR:-/opt/bhp/tls}/letsencrypt:/etc/letsencrypt
      - ${TLS_STATE_DIR:-/opt/bhp/tls}/webroot:/var/www/certbot
    networks: [frontend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
