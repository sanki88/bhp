name: ${COMPOSE_PROJECT_NAME:-bhp}
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, db_password]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-bhp.sh:ro
    healthcheck:
      # Verify the application role over TCP, after initialization has completed.
      test: [CMD-SHELL, "PGPASSWORD=$$(cat /run/secrets/db_password) psql -h 127.0.0.1 -U bhp -d bhp -Atqc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  app:
    image: bhp-app:${APP_VERSION:-local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      DB_HOST: db
      DB_NAME: bhp
      DB_USER: bhp
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSL: disable
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: 'true'
      MEDIA_DIR: /app/data/media
      TZ: Europe/Warsaw
    secrets: [db_password]
    volumes:
      - media_data:/app/data/media
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, frontend]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [frontend]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
networks:
  backend: { internal: true }
  frontend:
volumes:
  postgres_data:
  media_data:
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  db_password:
    file: ./secrets/db_password
